[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name            = "sovereign-workstation"
version         = "2.0.0"
description     = "Local desktop image and document conversion workstation"
requires-python = ">=3.11"
dependencies    = ["PySide6>=6.7.0"]

[project.scripts]
sovereign = "main:main"

# ── Test runner ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths   = ["tests"]
pythonpath  = ["."]
addopts     = "-v --tb=short"

# ── Linter ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # line-length handled separately
